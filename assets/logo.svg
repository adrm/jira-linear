<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Jira Linear">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <!-- status ring: three quarters filled, like a started ticket -->
  <circle cx="128" cy="128" r="70" fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="18"/>
  <circle cx="128" cy="128" r="70" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round"
          stroke-dasharray="330 440" transform="rotate(-90 128 128)"/>
  <!-- speed stroke -->
  <path d="M98 128h60m0 0-22-22m22 22-22 22" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
